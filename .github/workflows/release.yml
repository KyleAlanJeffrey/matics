name: Release

# Every push to main (a merge or a direct push) builds the macOS, Windows and Linux
# installers and publishes them as a GitHub release. The version is VERSION's major.minor
# with the run number as the patch (0.1.12), so each build is newer than the last and the
# in-app updater, which reads latest.json from the latest release, offers it. Running it by
# hand on another branch builds the same installers as workflow artifacts only.
#
# Needs the TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the
# key has one): updates are signed, and the app checks them against the public key in
# src-tauri/tauri.conf.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queued, never replaced, so every push gets its release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # The release starts as a draft so it only becomes visible once every installer is on it.
  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          version="${base%.*}.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A re-run keeps its run number, so it reuses the release its first attempt made.
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          if [ -n "$id" ]; then
            echo "id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Matics ${version}" \
            -f body="Built from ${GITHUB_SHA::7} on main. Download the installer for your platform below; the README has the first-launch steps." \
            -F draft=true \
            --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Also runs when create-release is skipped (a manual run off main).
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin
          - name: windows
            runner: windows-latest
            args: ""
          - name: linux
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install WebKitGTK and bundling tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile

      - name: Stamp the build version
        if: needs.create-release.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          '

      # Without a release id this only builds. latest.json is written by the publish job,
      # once every platform is up; three jobs editing it in turn could drop an entry.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: matics-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Only after all three platforms succeed; a failed build leaves the draft for inspection.
  publish:
    needs: [create-release, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      # The updater manifest: one update bundle and its signature per platform. The macOS
      # build is universal, so both Mac architectures get it.
      - name: Write latest.json
        run: |
          set -euo pipefail
          assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")"
          entry() {
            local name id
            name="$(jq -r --arg suffix "$1" '[.[] | select(.name | endswith($suffix))][0].name // empty' <<<"$assets")"
            id="$(jq -r --arg suffix "$1.sig" '[.[] | select(.name | endswith($suffix))][0].id // empty' <<<"$assets")"
            if [ -z "$name" ] || [ -z "$id" ]; then
              echo "No $1 update bundle with a signature on the release" >&2
              exit 1
            fi
            jq -n \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" \
              --arg signature "$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id")" \
              '{signature: $signature, url: $url}'
          }
          mac="$(entry .app.tar.gz)"
          windows="$(entry -setup.exe)"
          linux="$(entry .AppImage)"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac "$mac" --argjson windows "$windows" --argjson linux "$linux" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": $mac, "darwin-x86_64": $mac, "windows-x86_64": $windows, "linux-x86_64": $linux}}' \
            > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the release
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
