[package]
name = "diagram-maker"
version = "0.2.0"
description = "Matics: network and wiring diagrams with a documentation layer"
authors = ["Stout"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "diagram_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
dirs = "6"
trash = "5"
ureq = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
